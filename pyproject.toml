[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaktrap"
version = "0.3.1"
description = "Generate prompt-injection attacks, test real AI models (GPT, Claude, Ollama), and write an assessment report"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Maytham Alkhailani"}]
dependencies = []  # none: runs on plain Python

[project.optional-dependencies]
dev = ["pytest>=7"]
yaml = ["PyYAML>=6"]

[project.scripts]
leaktrap = "leaktrap.cli:main"

[tool.setuptools.packages.find]
include = ["leaktrap*"]

[tool.setuptools.package-data]
leaktrap = ["suites/*.json"]
