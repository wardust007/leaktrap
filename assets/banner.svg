<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="LeakTrap: catch AI models leaking secrets">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.55" stop-color="#14052e"/>
      <stop offset="0.72" stop-color="#3a0a4a"/>
      <stop offset="0.73" stop-color="#06020f"/>
      <stop offset="1" stop-color="#020108"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#9d4dff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9d4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#9d4dff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="beam2" x1="1" x2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <pattern id="hazard" width="28" height="14" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="14" height="14" fill="#ffb400"/>
      <rect x="14" width="14" height="14" fill="#05010f"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>
    <clipPath id="floorClip"><rect x="0" y="300" width="1200" height="120"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky, horizon glow -->
    <rect width="1200" height="420" fill="url(#sky)"/>
    <ellipse cx="600" cy="302" rx="560" ry="150" fill="url(#sun)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="70" cy="40" r="1.2" opacity="0.7"/><circle cx="210" cy="90" r="1" opacity="0.5"/>
      <circle cx="355" cy="28" r="1.3" opacity="0.8"/><circle cx="520" cy="70" r="0.9" opacity="0.5"/>
      <circle cx="760" cy="34" r="1.2" opacity="0.7"/><circle cx="905" cy="96" r="1" opacity="0.5"/>
      <circle cx="1040" cy="24" r="1.4" opacity="0.8"/><circle cx="1150" cy="120" r="1" opacity="0.6"/>
      <circle cx="640" cy="18" r="1" opacity="0.6"/><circle cx="1110" cy="200" r="0.9" opacity="0.5"/>
    </g>

    <!-- synthwave floor -->
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#ff2bd6" stroke-width="2.5" filter="url(#soft)"/>
    <g clip-path="url(#floorClip)" stroke="url(#floorFade)" stroke-width="1.4" fill="none" opacity="0.85">
      <path d="M0 308H1200M0 318H1200M0 332H1200M0 350H1200M0 374H1200M0 405H1200"/>
      <path d="M600 300L600 420M600 300L470 420M600 300L340 420M600 300L210 420M600 300L80 420M600 300L-50 420M600 300L-180 420M600 300L-310 420M600 300L730 420M600 300L860 420M600 300L990 420M600 300L1120 420M600 300L1250 420M600 300L1380 420M600 300L1510 420"/>
    </g>

    <!-- laser beams converging on the trapped AI -->
    <g filter="url(#soft)">
      <path d="M0 30 L126 118" stroke="url(#beam)" stroke-width="3"/>
      <path d="M0 360 L136 256" stroke="url(#beam)" stroke-width="3"/>
      <path d="M440 0 L306 118" stroke="url(#beam2)" stroke-width="3"/>
      <path d="M440 300 L298 256" stroke="url(#beam2)" stroke-width="3"/>
      <g fill="#ffffff"><circle cx="126" cy="118" r="4"/><circle cx="136" cy="256" r="4"/><circle cx="306" cy="118" r="4"/><circle cx="298" cy="256" r="4"/></g>
    </g>

    <!-- the trap: shield + brackets around an AI chip -->
    <g transform="translate(216 192)">
      <g filter="url(#glow)" fill="none">
        <path d="M0 -118 L92 -84 V-8 C92 52 52 92 0 112 C-52 92 -92 52 -92 -8 V-84 Z" stroke="#ff2bd6" stroke-width="6"/>
        <path d="M-118 -96 H-140 V96 H-118 M118 -96 H140 V96 H118" stroke="#39ff14" stroke-width="5"/>
      </g>
      <g filter="url(#soft)">
        <rect x="-38" y="-46" width="76" height="76" rx="10" fill="#0b0420" stroke="#00f0ff" stroke-width="4"/>
        <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round">
          <path d="M-22 -46V-58M0 -46V-58M22 -46V-58M-22 30V42M0 30V42M22 30V42M-38 -30H-50M-38 -8H-50M-38 14H-50M38 -30H50M38 -8H50M38 14H50"/>
        </g>
        <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff">AI</text>
      </g>
      <!-- leaked secret spilling out, caught by the trap -->
      <g font-family="'Courier New', monospace" font-weight="700" fill="#ff3860" filter="url(#soft)" text-anchor="middle">
        <text x="0" y="62" font-size="15">ACME-7F3A</text>
        <text x="6" y="80" font-size="13" opacity="0.75">9B21</text>
        <text x="-4" y="96" font-size="11" opacity="0.45">QUNNRS03</text>
      </g>
    </g>

    <!-- title with glitch -->
    <g font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="5">
      <text x="451" y="175" fill="#00f0ff" opacity="0.55">LEAKTRAP</text>
      <text x="439" y="169" fill="#ff2bd6" opacity="0.55">LEAKTRAP</text>
      <text x="444" y="172" fill="url(#title)" filter="url(#glow)">LEAKTRAP</text>
    </g>
    <rect x="460" y="124" width="190" height="5" fill="#00f0ff" opacity="0.8"/>
    <rect x="760" y="148" width="150" height="4" fill="#ff2bd6" opacity="0.85"/>
    <rect x="600" y="104" width="80" height="3" fill="#ffffff" opacity="0.7"/>

    <text x="448" y="222" font-family="'Courier New', monospace" font-size="27" fill="#e8e8ff" letter-spacing="1">&gt; catch AI models leaking secrets_</text>
    <text x="448" y="262" font-family="'Courier New', monospace" font-size="18" fill="#39ff14" filter="url(#soft)">prompt injection · red teaming · OWASP LLM 2026 · MITRE ATLAS</text>

    <!-- alert terminal strip -->
    <g font-family="'Courier New', monospace">
      <rect x="448" y="324" width="690" height="44" rx="8" fill="#05010f" fill-opacity="0.85" stroke="#ff3860" stroke-width="1.5" filter="url(#soft)"/>
      <text x="466" y="352" font-size="16" fill="#9a9ac0">$ leaktrap replay --target gpt</text>
      <text x="790" y="352" font-size="16" fill="#ff3860" font-weight="700" filter="url(#soft)">[!] SECRET LEAKED  3/5</text>
    </g>

    <!-- status -->
    <circle cx="1144" cy="42" r="7" fill="#ff3860" filter="url(#soft)"/>
    <text x="1128" y="47" text-anchor="end" font-family="'Courier New', monospace" font-size="15" fill="#ff3860" font-weight="700">LIVE FIRE</text>

    <!-- hazard tape -->
    <rect x="0" y="408" width="1200" height="12" fill="url(#hazard)" opacity="0.9"/>

    <!-- CRT scanlines -->
    <rect width="1200" height="420" fill="url(#scan)"/>
  </g>
  <rect x="3" y="3" width="1194" height="414" rx="20" fill="none" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="2" filter="url(#soft)"/>
</svg>
