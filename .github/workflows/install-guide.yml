name: 📦 install guide

# Follows the README Quick start word for word on Windows, Mac and Linux:
# clone, cd, run with plain Python. Nothing is installed with pip.
on:
  push:
  pull_request:

jobs:
  quick-start:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: "1️⃣ git clone + cd + run (no install)"
        shell: bash
        run: |
          git clone https://github.com/${{ github.repository }}.git
          cd leaktrap
          git checkout ${{ github.sha }}
          python -m leaktrap run --target demo:simulated --count 12 --repeats 1 --yes --quiet
          test -f results/report.html
          python -m leaktrap replay tool-abuse.delimiter-escape --target demo:compromised --times 2
          python -m leaktrap list --goals tool-abuse

  windows-command-prompt:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Same steps in Command Prompt
        shell: cmd
        run: |
          git clone https://github.com/${{ github.repository }}.git
          cd leaktrap
          git checkout ${{ github.sha }}
          set GEMINI_API_KEY=placeholder
          python -m leaktrap run --target demo:simulated --count 12 --repeats 1 --yes --quiet
          if not exist results\report.html exit /b 1

  optional-short-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optional install into a virtual environment
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -e .
          leaktrap run --target demo:simulated --count 12 --repeats 1 --yes --quiet
          test -f results/report.html
